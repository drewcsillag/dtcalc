<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>dtcalc</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>dtcalc</h1>
      <span class="tagline">dates, times, durations, zones</span>
    </header>

    <main id="scrollback" role="log" aria-live="polite" aria-label="Calculation history"></main>
    <p id="status" role="status">Loading calculator…</p>

    <form id="form" autocomplete="off">
      <label for="line" class="visually-hidden">Expression</label>
      <input
        id="line"
        type="text"
        disabled
        autocomplete="off"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        enterkeyhint="go"
        placeholder="now + 7h"
      />
      <button type="submit">Run</button>
    </form>

    <script type="module" src="app.js"></script>
  </body>
</html>

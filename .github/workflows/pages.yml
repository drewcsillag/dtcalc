name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing is granted at the workflow level; each job asks for what it needs.
permissions: {}

# One deploy at a time, and a newer push replaces one still waiting. A deploy
# already running is left to finish rather than cut off half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Everything that runs project code, or code fetched from npm and PyPI,
  # happens here with read-only access and no deployment rights, for the same
  # reason publish.yml splits its build from its release.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Set up Python
        run: uv python install

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the site
        run: make web-build

      - name: Check the size budget
        run: make web-budget

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  # Holds `pages: write` and `id-token: write`, so it runs no project code: it
  # only hands the artifact built above to GitHub Pages.
  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

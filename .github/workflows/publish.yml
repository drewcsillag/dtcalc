name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

# Nothing is granted at the workflow level; each job asks for what it needs.
permissions: {}

jobs:
  # Everything that runs project code, or code fetched from PyPI, happens
  # here -- with no permissions and no environment, so there is nothing to
  # steal. Splitting this from the publish job is the point: otherwise a
  # compromised dev dependency, or anything merged to main, would execute in
  # a job able to mint a PyPI token.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Set up Python
        run: uv python install

      - name: Check the tag matches the package version
        # A release tagged v0.2.0 that builds 0.1.0 would publish silently and
        # be unfixable, since PyPI does not allow re-uploading a version.
        if: github.event_name == 'release'
        run: |
          version=$(uv run python -c 'import dtcalc; print(dtcalc.__version__)')
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag version=$version"
          test "$tag" = "$version"

      - name: Check
        run: make check

      - name: Build
        run: uv build

      - name: Validate the built metadata
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # This job holds `id-token: write`, so it runs no project code and installs
  # nothing from PyPI -- it only takes the artifact built above and hands it
  # to the publish action.
  publish:
    needs: build
    runs-on: ubuntu-latest

    # The environment binds PyPI's Trusted Publisher configuration, and is
    # where an approval gate can be added.
    environment:
      name: pypi
      url: https://pypi.org/p/dtcalc-cli

    permissions:
      # Mints a short-lived OIDC token instead of using a stored API key.
      id-token: write

    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
